<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Super Gol</title>
    <link rel="stylesheet" href="./style.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;900&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="game-container">
      <canvas id="gameCanvas" width="800" height="600"></canvas>
      
      <!-- HUD -->
      <div id="hud" class="hidden">
        <div class="score-board">Gols: <span id="scoreVal">0</span></div>
        <div class="timer-board">Tempo: <span id="timerVal">45</span>s</div>
      </div>

      <!-- Start Screen Overlay -->
      <div id="startScreen" class="overlay">
        <h1>Super Gol</h1>
        <p>Faça o maior número de gols em 45 segundos!</p>
        <div class="tutorial">
          <p>⬅️ ➡️ Use as <strong>setas laterais</strong> para mirar.</p>
          <p>🕹️ Pressione <strong>ESPAÇO</strong> para chutar.</p>
        </div>
        <button id="startBtn">Começar Jogo</button>
      </div>

      <!-- Game Over Screen Overlay -->
      <div id="gameOverScreen" class="overlay hidden">
        <h1>Fim de Jogo!</h1>
        <p>Você fez <span id="finalScore">0</span> gols.</p>
        <button id="restartBtn">Jogar Novamente</button>
      </div>
      
      <!-- Events -->
      <div id="goalCelebration" class="hidden">GOL!</div>
      <div id="saveCelebration" class="hidden">DEFENDEU!</div>
    </div>
    
    <script type="module" src="./main.js"></script>
  </body>
</html>
